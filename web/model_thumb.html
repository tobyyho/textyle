<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:transparent; }
    canvas { display:block; width:100%; height:100%; background:transparent; pointer-events:none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const modelUrl = new URLSearchParams(window.location.search).get('model');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.01, 500);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'low-power' });

  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.25));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c7d9, 2.8));

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
  keyLight.position.set(3, 5, 6);
  scene.add(keyLight);

  const group = new THREE.Group();
  scene.add(group);

  const loader = new GLTFLoader();

  function unique(values) {
    return [...new Set(values.filter(Boolean))];
  }

  function candidateUrls(url) {
    if (!url) return [];

    const decoded = decodeURIComponent(url);
    const withoutLeadingSlash = decoded.replace(/^\//, '');
    const candidates = [decoded, `/${withoutLeadingSlash}`];

    if (withoutLeadingSlash.startsWith('assets/')) {
      candidates.push(`/assets/${withoutLeadingSlash}`);
    }
    if (withoutLeadingSlash.startsWith('assets/assets/')) {
      candidates.push(`/${withoutLeadingSlash.replace(/^assets\//, '')}`);
    }
    if (decoded.startsWith('/assets/')) {
      candidates.push(decoded.replace('/assets/', '/assets/assets/'));
    }
    if (decoded.startsWith('/assets/assets/')) {
      candidates.push(decoded.replace('/assets/assets/', '/assets/'));
    }

    return unique(candidates);
  }

  function loadUrl(url) {
    return new Promise((resolve, reject) => {
      loader.load(url, gltf => resolve(gltf.scene), undefined, reject);
    });
  }

  function prepareModel(model) {
    model.traverse(child => {
      if (!child.isMesh) return;

      child.frustumCulled = false;
      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      for (const material of materials) {
        if (!material) continue;
        material.side = THREE.DoubleSide;
        material.needsUpdate = true;
      }
    });

    return model;
  }

  function renderThumbnail() {
    renderer.render(scene, camera);
  }

  function frameModel() {
    const box = new THREE.Box3().setFromObject(group);
    if (box.isEmpty()) return;

    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    group.position.sub(center);
    group.rotation.set(0, 0, 0);
    group.updateMatrixWorld(true);

    const maxSize = Math.max(size.x, size.y, size.z);
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const distance = Math.abs(maxSize / Math.sin(fov / 2)) * 0.62;

    camera.position.set(0, 0, distance);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    renderThumbnail();
  }

  async function loadModel() {
    if (!modelUrl) return;

    for (const candidate of candidateUrls(modelUrl)) {
      try {
        const model = prepareModel(await loadUrl(candidate));
        group.add(model);
        frameModel();
        return;
      } catch (error) {
        console.debug('Thumbnail candidate failed:', candidate);
      }
    }
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderThumbnail();
  });

  loadModel();
</script>
</body>
</html>
