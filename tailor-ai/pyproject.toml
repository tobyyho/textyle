[project]
name = "tailor-ai"
version = "0.0.0"
description = "Private Tailor clothing-classification capstone foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.tailor]
private = true
published = false
dependency-strategy = "Pinned requirements files preserve the official PyTorch CUDA index; environment-lock.txt is an audit snapshot."

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
